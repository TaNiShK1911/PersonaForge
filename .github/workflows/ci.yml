# ============================================================
# PersonaForge — CI/CD Pipeline
# ============================================================
# Runs on every push and PR to main. Checks:
#   1. Lint (ESLint)
#   2. Typecheck (TypeScript compiler)
#   3. Unit tests (bun test)
#   4. Build (Next.js production build)
#   5. Security scan (npm audit + CodeQL placeholder)
#   6. E2E tests (Playwright, only on main)
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "file:./ci-test.db"
  NEXTAUTH_SECRET: "ci-test-secret"
  NODE_ENV: test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:push
      - run: bun test src/lib/tests/unit/ --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test src/lib/tests/integration/

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:push
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/standalone/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: npm audit (high severity)
        run: bunx npm-audit --level high || true
      - name: Check for secrets in code
        run: |
          ! grep -rE "(sk-ant-|sk-proj-|AKIA|ghp_)" --include="*.ts" --include="*.tsx" --include="*.py" src/ backend/ || \
          (echo "ERROR: Hardcoded secrets detected" && exit 1)

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run db:push
      - run: bunx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security-scan, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Vercel (staging)
        run: |
          echo "Vercel auto-deploys on push to main via GitHub integration."
          echo "Backend auto-deploys to Railway via GitHub integration."
          echo "Production promotion happens manually after QA sign-off."
