# ============================================================
# PersonaForge — Production Docker Compose
# ============================================================
# Full stack: Next.js frontend + Postgres + Redis + (optional) FastAPI backend
# Usage: docker compose up -d
# ============================================================

version: "3.9"

services:
  # ----------------------------------------------------------
  # PostgreSQL with pgvector extension
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: personaforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personaforge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/seeds:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d personaforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis (cache + BullMQ queue)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: personaforge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # FastAPI backend (production target)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: personaforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://forge:${POSTGRES_PASSWORD:-forge_dev}@postgres:5432/personaforge
      REDIS_URL: redis://redis:6379
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - "8000:8000"

  # ----------------------------------------------------------
  # Next.js frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personaforge-frontend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://forge:${POSTGRES_PASSWORD:-forge_dev}@postgres:5432/personaforge
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev_secret}
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: info
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
